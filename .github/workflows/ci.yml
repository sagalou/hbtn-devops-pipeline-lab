# Continuous integration for hbtn-devops-pipeline-lab.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache the npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run the test suite
        run: npm test -- --reporters=default --reporters=jest-junit
        env:
          DATABASE_URL: postgres://pipeline:pipeline@localhost:5432/pipeline
          JEST_JUNIT_OUTPUT_DIR: ./reports

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ./reports/
          retention-days: 7

  build:
    name: Build and publish image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}

    steps:
      - name: Trigger Render deploy
        run: |
          curl -f -sS -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            -o deploy.json
          DEPLOY_ID=$(jq -r '.id // empty' deploy.json)
          if [ -z "$DEPLOY_ID" ]; then
            echo "Deploy queued behind another one, tracking the latest deploy"
            DEPLOY_ID=$(curl -f -sS "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys?limit=1" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq -r '.[0].deploy.id')
          fi
          echo "DEPLOY_ID=${DEPLOY_ID}" >> "$GITHUB_ENV"

      - name: Wait for the deploy to go live
        run: |
          for attempt in $(seq 1 40); do
            status=$(curl -f -sS "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq -r '.status')
            echo "Attempt ${attempt}/40: deploy status ${status}"
            case "$status" in
              live) exit 0 ;;
              *failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 15
          done
          echo "Deploy did not go live in time"
          exit 1

      - name: Verify staging health and database
        run: |
          for attempt in $(seq 1 10); do
            health=$(curl -s -o /dev/null -w '%{http_code}' "${STAGING_URL}/health")
            items=$(curl -s -o /dev/null -w '%{http_code}' "${STAGING_URL}/items")
            echo "Attempt ${attempt}/10: /health=${health} /items=${items}"
            if [ "$health" = "200" ] && [ "$items" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Staging did not become healthy in time"
          exit 1
